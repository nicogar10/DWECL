<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador ternario</title>
</head>
<body>
    <h2>2. Investiga el operador ternario y pon un ejemplo completo de uso.</h2>

    <p id="texto"></p>

    <script>
        let edad = 20;
        let resEdad = edad >= 18 ? "Es mayor de edad" : "Es menor de edad";
        document.getElementById("texto").textContent = ("La edad " + edad + ": " + resEdad);
    </script>
</body>
</html>
