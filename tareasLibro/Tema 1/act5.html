<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes de bienvenida</title>

    <style>
        .ruso {
            color: blue;
        }

        .espanol {
            color: green;
        }

        .ingles {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Mensajes de bienvenida</h1>

    <button onclick="ruso()">Ruso</button>
    <button onclick="espanol()">Español</button>
    <button onclick="ingles()">Inglés</button>

    <p id="mensaje"></p>

    <script>
        function ruso() {
            document.getElementById("mensaje").textContent = "Добро пожаловать";
            document.getElementById("mensaje").className = "ruso";
        }

        function espanol() {
            document.getElementById("mensaje").textContent = "Bienvenido";
            document.getElementById("mensaje").className = "espanol";
        }

        function ingles() {
            document.getElementById("mensaje").textContent = "Welcome";
            document.getElementById("mensaje").className = "ingles";
        }
    </script>

</body>
</html>
