<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page Design</title>
</head>
<body>
    
    <button onclick="botonModificar()">Boton para modificar</button>

    <script>
        function sayHello() {
            document.write("Hello, Coding Ground!")
        }
        sayHello()

        function botonModificar() {
            document.title = "Modificando el contenido"
        }
    </script>

</body>
</html>
